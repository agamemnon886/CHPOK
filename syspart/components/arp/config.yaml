# Modified by Kirill Brazhnikov, 2026-11-14: description and state_doc give the
# documentation of the components and of their state members.
- name: ARP_ANSWERER
  description: >-
    It answers the ARP requests it receives (portA) for its IPv4 addresses
    with its MAC address (portB).
  #additional_h_files: ['"arp_ip_list.h"']
  state_struct:
      good_ips[10]: uint32_t
      good_ips_len: uint32_t
      src_mac[6]: uint8_t
  state_doc:
      good_ips[10]: >-
        The IPv4 addresses it answers for.
      good_ips_len: >-
        The number of addresses in good_ips.
      src_mac[6]: >-
        The MAC address it answers with.
  in_ports:
      - name: portA
        type: message_handler
        implementation:
            handle: arp_receive

  out_ports:
      - name: portB
        type: ethernet_packet_sender
