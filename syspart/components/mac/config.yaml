# Modified by Kirill Brazhnikov, 2026-11-04: MISRA C:2025: MAC_SENDER
# implements mac_send with mac_sender_send() (Rule 5.8: the interface
# member is named mac_send).
- name: MAC_SENDER
  #additional_h_files: ['<port_info.h>']
  state_struct:
      src_mac[6]: uint8_t

  in_ports:
      - name: portA
        type: ethernet_packet_sender
        implementation:
            mac_send: mac_sender_send
            flush: mac_flush
  out_ports:
      - name: portB
        type: preallocated_sender

- name: MAC_RECEIVER
  #additional_h_files: ['<port_info.h>']
  state_struct:
      my_mac[6]: uint8_t

  in_ports:
      - name: portA
        type: message_handler
        implementation:
            handle: mac_receive

  out_ports:
      - name: port_UDP
        type: message_handler

      - name: port_ARP
        type: message_handler

